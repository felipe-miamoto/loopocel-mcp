[project]
name = "loopocel-mcp"
version = "0.1.0"
description = "MCP server and capture adapters for constructing LoopOCEL (OCEL 2.0) agent execution logs and coverage figures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10,<2",
    "matplotlib>=3.8.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
pm4py = [
    "pm4py>=2.7.22,<2.8",
    "pandas>=2.1.0",
]

[project.scripts]
loopocel-mcp = "loopocel_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopocel_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
